# ==========================================================
# SmartStay Hotel Reservation Management System Configuration
# ==========================================================

# Port Configuration
server.port=9090
server.servlet.context-path=/

# Application Name
spring.application.name=SmartStay-Hotel-System

# ==========================================================
# Microsoft SQL Server Database Configuration
# ==========================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SmartStayDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=smartstay_user
spring.datasource.password=SmartStay@2026
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ==========================================================
# Thymeleaf Configuration
# ==========================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# File Upload Settings (For receipts / images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Session & Cookie Configuration
server.servlet.session.timeout=1d
server.servlet.session.cookie.max-age=86400
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie

# Logging Configuration
logging.level.com.smartstay=INFO
logging.level.org.springframework.jdbc.core=INFO

