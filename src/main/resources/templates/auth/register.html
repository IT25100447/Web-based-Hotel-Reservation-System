<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Create Guest Account - SmartStay')}"></head>
<body>

<header th:replace="~{fragments/header :: navbar}"></header>
<div th:replace="~{fragments/header :: alerts}"></div>

<main class="main-content" style="max-width: 550px;">
    <div class="card" style="padding: 2.5rem 2rem; border-top: 4px solid var(--accent);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo" style="color: var(--primary-dark); font-size: 2rem; justify-content: center; margin-bottom: 0.5rem;">
                <span style="color: var(--accent);">✦</span> SmartStay
            </div>
            <h2 style="font-family: var(--font-heading); color: var(--primary-dark); font-size: 1.5rem;">Create Guest Account</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Join SmartStay to manage bookings, earn discounts, and track stays</p>
        </div>

        <div id="clientValidationErrors" class="alert alert-error" style="display: none;"></div>

        <form id="registerForm" th:action="@{/register}" method="POST" th:object="${registerDto}">
            <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Kamal Perera" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="kamal@example.com" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Contact Phone</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="+94 71 123 4567">
                </div>
                <div class="form-group">
                    <label class="form-label">Home Address</label>
                    <input type="text" th:field="*{address}" class="form-control" placeholder="Colombo, Sri Lanka">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Min 6 characters" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Re-type password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
                Create Account &rarr;
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a th:href="@{/login}" style="font-weight: 600;">Sign in here</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
