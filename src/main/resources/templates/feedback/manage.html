<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Guest Relations & Complaints - Staff')}"></head>
<body>

<header th:replace="~{fragments/header :: navbar}"></header>
<div th:replace="~{fragments/header :: alerts}"></div>

<main class="main-content">
    <div style="display: grid; grid-template-columns: 260px 1fr; gap: 2rem; align-items: start;">
        <div th:replace="~{fragments/sidebar :: staffSidebar('feedback')}"></div>

        <div>
            <div class="page-header">
                <div>
                    <h1 class="page-title">Guest Relations &amp; Complaints</h1>
                    <p class="page-subtitle">Track guest feedback tickets, update resolution status, and initiate refund outcomes.</p>
                </div>
                <div style="display:flex;gap:0.75rem;align-items:center;">
                    <form method="GET" th:action="@{/staff/feedback}" style="display:flex;gap:0.5rem;">
                        <input type="text" name="search" th:value="${search}" placeholder="🔍 Search by guest, category, comments..." class="form-control" style="width:280px;padding:0.45rem 0.85rem;font-size:0.88rem;">
                        <button type="submit" class="btn btn-secondary btn-sm">Search</button>
                        <a th:if="${search != null and !search.isBlank()}" th:href="@{/staff/feedback}" class="btn btn-outline btn-sm">Clear</a>
                    </form>
                    <a th:href="@{/staff/refunds}" class="btn btn-outline btn-sm">View All Refunds &rarr;</a>
                </div>
            </div>

            <div class="card" style="padding: 0; overflow: hidden;">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Ticket #</th>
                                <th>Guest</th>
                                <th>Category & Rating</th>
                                <th>Comments</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="f : ${feedbackList}">
                                <td><strong th:text="'#' + ${f.feedbackId}">#1</strong></td>
                                <td>
                                    <strong th:text="${f.guestName}">Kamal</strong>
                                    <div style="font-size: 0.8rem; color: var(--text-muted);" th:text="'Booking #' + ${f.reservationId} + ' (Room ' + ${f.roomNumber} + ')'">#1</div>
                                </td>
                                <td>
                                    <span class="badge badge-info" th:text="${f.category}">SERVICE</span>
                                    <div style="color: #f59e0b; font-size: 0.85rem; margin-top: 0.2rem;" th:text="'★ ' + ${f.rating} + '/5'">★ 5/5</div>
                                </td>
                                <td style="max-width: 250px;">
                                    <div style="font-size: 0.9rem; line-height: 1.4;" th:text="${f.comments}">Comments</div>
                                    <div th:if="${f.refund != null}" style="font-size: 0.75rem; color: #92400e; background: #fef3c7; padding: 0.2rem 0.4rem; border-radius: 4px; display: inline-block; margin-top: 0.25rem;">
                                        Refund $<span th:text="${f.refund.amount}"></span> (<span th:text="${f.refund.status}"></span>)
                                    </div>
                                </td>
                                <td>
                                    <form th:action="@{/staff/feedback/update-status}" method="POST" style="display: inline-flex; gap: 0.35rem; align-items: center;">
                                        <input type="hidden" name="feedbackId" th:value="${f.feedbackId}">
                                        <select name="status" class="form-control" style="padding: 0.25rem 0.4rem; font-size: 0.8rem; width: auto;">
                                            <option value="OPEN" th:selected="${f.status == 'OPEN'}">Open</option>
                                            <option value="IN_PROGRESS" th:selected="${f.status == 'IN_PROGRESS'}">In Progress</option>
                                            <option value="RESOLVED" th:selected="${f.status == 'RESOLVED'}">Resolved</option>
                                        </select>
                                        <button type="submit" class="btn btn-secondary btn-sm" title="Update Status">Save</button>
                                    </form>
                                </td>
                                <td>
                                    <div style="display:flex;gap:0.4rem;flex-wrap:wrap;">
                                        <button th:if="${f.refund == null}" type="button" class="btn btn-outline btn-sm"
                                                th:onclick="'openRefundModal(' + ${f.feedbackId} + ')'">
                                            + Refund
                                        </button>
                                        <button type="button" class="btn btn-secondary btn-sm"
                                                th:onclick="'openRespondModal(' + ${f.feedbackId} + ')'">
                                            💬 Respond
                                        </button>
                                        <form th:action="@{'/staff/feedback/delete/' + ${f.feedbackId}}" method="POST" style="display:inline;"
                                              onsubmit="return confirm('Delete this feedback ticket? This cannot be undone.')">
                                            <button type="submit" class="btn btn-danger btn-sm">🗑 Delete</button>
                                        </form>
                                    </div>
                                </td>

                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Issue Refund Modal -->
<div id="refundModal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 480px; width: 90%;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <h3 style="font-family: var(--font-heading); color: var(--primary-dark);">Issue Refund Request</h3>
            <button type="button" class="btn btn-secondary btn-sm" data-close-modal>&times;</button>
        </div>

        <form th:action="@{/staff/feedback/refund}" method="POST">
            <input type="hidden" id="modalFeedbackId" name="feedbackId">

            <div class="form-group">
                <label class="form-label">Refund Amount ($) *</label>
                <input type="number" step="0.01" min="1" name="amount" class="form-control" placeholder="100.00" required>
            </div>

            <div class="form-group">
                <label class="form-label">Reason / Justification *</label>
                <textarea name="reason" rows="3" class="form-control" placeholder="Describe reason (e.g. cancellation policy, service recovery)..." required></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                <button type="submit" class="btn btn-primary">Submit Refund Request</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Staff Respond Modal -->
<div id="respondModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.65);z-index:2000;align-items:center;justify-content:center;backdrop-filter:blur(4px);">
    <div class="card" style="max-width:500px;width:92%;border-radius:var(--radius-xl);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border);">
            <h3 style="font-family:var(--font-heading);color:var(--primary-dark);">Add Staff Response</h3>
            <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('respondModal').style.display='none'">&times;</button>
        </div>
        <form th:action="@{/staff/feedback/respond}" method="POST">
            <input type="hidden" id="respondFeedbackId" name="feedbackId">
            <div class="form-group">
                <label class="form-label">Response / Resolution Notes *</label>
                <textarea name="response" rows="4" class="form-control" placeholder="Write your response or action taken..." required></textarea>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:0.75rem;margin-top:1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('respondModal').style.display='none'">Cancel</button>
                <button type="submit" class="btn btn-primary">Submit Response</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openRefundModal(feedbackId) {
        document.getElementById('modalFeedbackId').value = feedbackId;
        openModal('refundModal');
    }
    function openRespondModal(feedbackId) {
        document.getElementById('respondFeedbackId').value = feedbackId;
        document.getElementById('respondModal').style.display = 'flex';
    }
    document.getElementById('respondModal').addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
    });
</script>

</body>
</html>
