<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Reset Password - SmartStay')}"></head>
<body>

<header th:replace="~{fragments/header :: navbar}"></header>
<div th:replace="~{fragments/header :: alerts}"></div>

<main class="main-content" style="max-width: 500px;">
    <div class="card" style="padding: 2.5rem 2rem; border-top: 4px solid var(--accent);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo" style="color: var(--primary-dark); font-size: 2rem; justify-content: center; margin-bottom: 0.5rem;">
                <span style="color: var(--accent);">✦</span> SmartStay
            </div>
            <h2 style="font-family: var(--font-heading); color: var(--primary-dark); font-size: 1.5rem;">Password Recovery</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Verify your account details to set a new password</p>
        </div>

        <form th:action="@{/reset-password}" method="POST">
            <div class="form-group">
                <label class="form-label">Account Email Address *</label>
                <input type="email" name="email" class="form-control" placeholder="your.email@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Registered Phone Number (Verification)</label>
                <input type="text" name="phone" class="form-control" placeholder="e.g. +94 77 123 4567">
            </div>

            <div class="form-group">
                <label class="form-label">New Password *</label>
                <input type="password" name="newPassword" class="form-control" placeholder="Min 6 characters" required>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm New Password *</label>
                <input type="password" name="confirmPassword" class="form-control" placeholder="Re-type new password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
                Reset Password &rarr;
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
            Remembered your credentials? <a th:href="@{/login}" style="font-weight: 600;">Sign in</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
