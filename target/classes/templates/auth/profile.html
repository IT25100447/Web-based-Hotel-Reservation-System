<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('My Profile - SmartStay')}"></head>
<body>

<header th:replace="~{fragments/header :: navbar}"></header>
<div th:replace="~{fragments/header :: alerts}"></div>

<main class="main-content" style="max-width: 650px;">
    <div class="page-header">
        <div>
            <h1 class="page-title">Personal Profile & Settings</h1>
            <p class="page-subtitle">Manage your personal details and account credentials.</p>
        </div>
    </div>

    <div class="card" style="padding: 2.5rem 2rem;">
        <form th:action="@{/profile}" method="POST">
            <div class="form-group">
                <label class="form-label">Email Address (Immutable)</label>
                <input type="email" class="form-control" th:value="${currentUser.email}" readonly style="background: #f1f5f9; cursor: not-allowed;">
            </div>

            <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-control" th:value="${currentUser.name}" required>
            </div>

            <!-- Guest Specific Fields -->
            <div th:if="${guest != null}">
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control" th:value="${guest.phone}">
                </div>
                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-control" th:value="${guest.address}">
                </div>
            </div>

            <!-- Staff Specific Fields -->
            <div th:if="${staff != null}">
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control" th:value="${staff.phone}">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <input type="text" class="form-control" th:value="${staff.role}" readonly style="background: #f1f5f9;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Branch</label>
                        <input type="text" class="form-control" th:value="${staff.branchName}" readonly style="background: #f1f5f9;">
                    </div>
                </div>
            </div>

            <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border);">
                <h4 style="font-size: 1rem; margin-bottom: 0.75rem; color: var(--primary-dark);">Change Password</h4>
                <div class="form-group">
                    <label class="form-label">New Password (leave blank to keep current)</label>
                    <input type="password" name="newPassword" class="form-control" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
                Save Changes
            </button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
