<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('System Audit Logs - Staff')}"></head>
<body>

<header th:replace="~{fragments/header :: navbar}"></header>
<div th:replace="~{fragments/header :: alerts}"></div>

<main class="main-content">
    <div style="display: grid; grid-template-columns: 260px 1fr; gap: 2rem; align-items: start;">
        <div th:replace="~{fragments/sidebar :: staffSidebar('logs')}"></div>

        <div>
            <div class="page-header">
                <div>
                    <h1 class="page-title">System Activity Audit Trail</h1>
                    <p class="page-subtitle">Immutable security log of operations performed by hotel staff across all departments.</p>
                </div>
            </div>

            <div class="card" style="padding: 0; overflow: hidden;">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Staff Member</th>
                                <th>Role</th>
                                <th>Action Performed</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${logs}">
                                <td style="white-space: nowrap; font-size: 0.85rem; color: var(--text-muted);"
                                    th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}">
                                    2026-09-18 20:00:00
                                </td>
                                <td><strong th:text="${log.staffName}">Kasun Wijeratne</strong></td>
                                <td><span class="badge badge-info" th:text="${log.staffRole}">IT</span></td>
                                <td style="font-family: monospace; font-size: 0.9rem;" th:text="${log.action}">Updated room status</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
